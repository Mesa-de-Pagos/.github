name: "Release Notes API Partner Centralizado"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch a releaser"
        default: "main"
        required: true

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Clona el repositorio destino (api-partner) en la raíz del workspace
      - name: Check out api-partner repo
        uses: actions/checkout@v4
        with:
          repository: Mesa-de-Pagos/api-partner
          ref: ${{ inputs.branch }}
          token: ${{ secrets.API_PARTNER_PAT }}

      # 2. Clona tu repositorio central (.github) en la subcarpeta 'central-repo'
      - name: Check out central scripts repo
        uses: actions/checkout@v4
        with:
          path: central-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instala dependencias SOLO dentro de la carpeta central-repo
      - name: Instala dependencias del script
        working-directory: ./central-repo
        run: npm install @octokit/rest semver

      # 4. Genera changelog y version
      # Se ejecuta en la raíz (para que lea el código de api-partner)
      # pero el script de Node usará los node_modules de central-repo
      - name: Genera changelog y version
        env:
          GITHUB_TOKEN: ${{ secrets.API_PARTNER_PAT }}
        run: |
          node central-repo/.github/scripts/generate-multibranch-changelog.js > multibranch-changelog.md
          echo "version=$(cat version.txt)" >> $GITHUB_ENV

      # 5. Crear/Editar Draft Release
      - name: Crear/Editar Draft Release en api-partner
        env:
          GH_TOKEN: ${{ secrets.API_PARTNER_PAT }}
        run: |
          gh release create v${{ env.version }} --draft --notes-file multibranch-changelog.md --repo Mesa-de-Pagos/api-partner --target ${{ inputs.branch }} || \
          gh release edit v${{ env.version }} --notes-file multibranch-changelog.md --repo Mesa-de-Pagos/api-partner --target ${{ inputs.branch }}
